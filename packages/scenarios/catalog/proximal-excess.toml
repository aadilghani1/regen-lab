name = "proximal-excess"
summary = "Give cells a stronger signal that they are near the shoulder. Do they rebuild parts that are still there?"

[benchmark]
observation = "Excess proximal signal (e.g. retinoic acid) proximalizes the blastema and duplicates proximal structure."
expectedOutcome = "duplication"
assumptions = ["A4-proximalization", "A7-shared-blastema-signalling"]

[model.treatment]
exogenousProximal = 0.2
exogenousWindow = [0, 40]
