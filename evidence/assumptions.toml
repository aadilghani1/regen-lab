[[assumption]]
id = "A1-nerve-dependence"
module = "trigger"
statement = "Blastema formation and outgrowth require nerve signal; denervated limbs do not regenerate."
status = "supported"
params = ["model.cells.nerveThreshold", "model.signals.nerve.production", "model.treatment.denervate"]
citations = [
  { ref = "Singer M. (1952) The influence of the nerve in regeneration of the amphibian extremity. Q Rev Biol.", doi = "10.1086/398873", pmid = "14949331" },
  { ref = "Kumar A. et al. (2007) Molecular basis for the nerve dependence of limb regeneration in an adult vertebrate. Science.", doi = "10.1126/science.1147710", pmid = "17975060", verified = true },
]

[[assumption]]
id = "A2-distal-growth-signal"
module = "progenitor-pool"
statement = "A distal tip signal gates progenitor outgrowth at a fixed threshold in the model."
status = "hypothesis"
params = ["model.signals.distalGrowth.production", "model.cells.distalGrowthThreshold"]
citations = [
  { ref = "Endo T., Bryant S.V., Gardiner D.M. (2004) A stepwise model system for limb regeneration. Dev Biol.", doi = "10.1016/j.ydbio.2004.02.016", pmid = "15136146" },
]

[[assumption]]
id = "A3-local-lineage-restricted-progenitors"
module = "progenitor-pool"
statement = "The model recruits progenitors from a fixed depth of tissue next to the cut."
status = "hypothesis"
params = ["model.cells.blastemaDepth"]
citations = [
  { ref = "Kragl M. et al. (2009) Cells keep a memory of their tissue origin during axolotl limb regeneration. Nature.", doi = "10.1038/nature08152", pmid = "19571878" },
]
notes = "Kragl describes lineage restriction. The abstract does not establish the implemented recruitment depth. Lineages are roadmap M3."

[[assumption]]
id = "A4-proximalization"
module = "pattern"
statement = "Excess proximal signal while the blastema forms proximalizes positional identity and duplicates proximal structure."
status = "supported"
params = ["model.treatment.exogenousProximal", "model.cells.proximalSensitivity", "model.signals.proximal.production", "model.signals.proximal.tipDegradation"]
citations = [
  { ref = "Maden M. (1982) Vitamin A and pattern formation in the regenerating limb. Nature.", doi = "10.1038/295672a0", pmid = "7057925" },
]

[[assumption]]
id = "A5-intercalation-stop"
module = "termination"
statement = "Outgrowth fills the gap between the stump's positional identity and the distal identity, then terminates."
status = "hypothesis"
params = ["model.cells.termination"]
notes = "Intercalation is a classical idea; reducing it to one scalar along one axis is our simplification. Completion requires target length within 5%, ordered nerve-row identity, an exhausted progenitor pool and no recent length increase. Extending at least one full identity increment beyond the distal identity records failure of termination even after boundary crowding exhausts the pool."

[[assumption]]
id = "A6-macrophages-required"
module = "trigger"
statement = "Macrophages are required for regeneration; depleting them leads to scarring."
status = "supported"
citations = [
  { ref = "Godwin J.W., Pinto A.R., Rosenthal N.A. (2013) Macrophages are required for adult salamander limb regeneration. PNAS.", doi = "10.1073/pnas.1300290110", pmid = "23690624", verified = true },
]
notes = "Not modelled yet: roadmap M2."

[[assumption]]
id = "A7-shared-blastema-signalling"
module = "pattern"
statement = "When identity is reset, the blastema acts as one signalling compartment: every progenitor receives the mean shift."
status = "hypothesis"
params = ["model.cells.proximalSensitivity"]

[[assumption]]
id = "A8-positional-interaction"
module = "pattern"
statement = "In this model the initial wound can signal in anterior-only tissue. Continued distal signal production after wound closure requires both positional identities."
status = "hypothesis"
params = ["model.treatment.positionalTissue"]
citations = [
  { ref = "Nacu E. et al. (2016) FGF8 and SHH substitute for anterior-posterior tissue interactions to induce limb regeneration. Nature.", doi = "10.1038/nature17972", pmid = "27120163" },
]
notes = "The abstract supports the qualitative anterior-only contrast. Switching production at wound closure is a modelling choice."
